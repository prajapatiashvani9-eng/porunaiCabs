<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Website Title -->
    <title>
      Porunai Cabs | Taxi Service in Tirunelveli
    </title>

    <!-- SEO Meta Description -->
    <meta
      name="description"
      content="Looking for a reliable taxi service in Tirunelveli? Choose Porunai Cabs for local taxi rides, outstation trips, airport transfers, one-way cabs and round-trip travel."
    />

    <!-- Search Engine Indexing -->
    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Website Author -->
    <meta
      name="author"
      content="Porunai Cabs"
    />

    <!-- Favicon: Your Website Logo -->
    <link
      rel="icon"
      type="image/jpeg"
      href="/logo.jpeg"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://porunaicabs.com/"
    />

    <!-- Theme Color -->
    <meta
      name="theme-color"
      content="#ffffff"
    />

    <!-- Open Graph: Social Media Sharing -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Porunai Cabs"
    />

    <meta
      property="og:title"
      content="Porunai Cabs | Taxi Service in Tirunelveli"
    />

    <meta
      property="og:description"
      content="Explore local taxi services, outstation trips, airport transfers and comfortable cab travel with Porunai Cabs."
    />

    <meta
      property="og:url"
      content="https://porunaicabs.com/"
    />

    <meta
      property="og:image"
      content="https://porunaicabs.com/logo.jpeg"
    />

    <!-- Twitter / X Sharing -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Porunai Cabs | Taxi Service in Tirunelveli"
    />

    <meta
      name="twitter:description"
      content="Book local taxis, outstation cabs and airport transfers with Porunai Cabs."
    />

    <meta
      name="twitter:image"
      content="https://porunaicabs.com/logo.jpeg"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
